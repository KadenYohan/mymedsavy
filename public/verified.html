<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verified | SafeMeds</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f0fdfa 0%, #ecfeff 100%);
        color: #0f172a;
      }

      .card {
        width: min(92vw, 520px);
        background: #ffffff;
        border: 1px solid #ccfbf1;
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(15, 118, 110, 0.12);
        padding: 28px;
        text-align: center;
      }

      .badge {
        width: 56px;
        height: 56px;
        margin: 0 auto 14px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: #ccfbf1;
        color: #0f766e;
        font-size: 28px;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }

      p {
        margin: 0 0 22px;
        line-height: 1.45;
        color: #334155;
      }

      a {
        display: inline-block;
        text-decoration: none;
        background: #0f766e;
        color: #ffffff;
        font-weight: 600;
        padding: 11px 18px;
        border-radius: 10px;
      }

      a:hover {
        background: #0d665f;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">✓</div>
      <h1>Email verified</h1>
      <p>Your account is now verified. Return to SafeMeds and sign in.</p>
      <a href="./#/auth">Go to login</a>
    </main>
  </body>
</html>
